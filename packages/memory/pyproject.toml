[project]
name = "dlightrag-memory"
version = "2.0.7"
description = "Reusable cross-conversation profile memory for DlightRAG"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    "asyncpg>=0.31.0",
    "mcp>=2.0.0",
    "pydantic>=2.11.0",
]

[project.scripts]
dlightrag-memory-mcp = "dlightrag_memory.mcp_server:main"

[build-system]
# Forward-only policy: CI verifies new backend releases; do not add an upper bound.
requires = ["uv_build>=0.11.21"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["compose.yaml", "examples/**"]
source-exclude = ["**/.DS_Store"]
