<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="frontend-title frontend-description">
  <title id="frontend-title">DlightRAG Web frontend ownership</title>
  <desc id="frontend-description">Vite startup and build concerns are an unconnected caption, not a runtime owner. Inside the browser, the main document contains the dl-app Shell and collective light-DOM Lit Feature owners. Features use focused shared state, a browser API boundary, and the package design system; Chat privately owns RunController and run following and replay. Artifact Canvas may load active HTML into an explicit-consent opaque-origin iframe. Same-origin API clients call the FastAPI Web Adapter over HTTP and server-sent events. Every solid arrow means browser-time composition or invocation.</desc>
  <defs>
    <marker id="frontend-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #fafaf9; }
      .browser { fill: #f5f5f4; stroke: #d6d3d1; stroke-width: 1.2; }
      .area { fill: none; stroke: #c7c2bd; stroke-width: 1.2; }
      .node { fill: #fff; stroke: #d6d3d1; stroke-width: 1.2; }
      .shell, .state { fill: #f7f2e5; stroke: #c6a85d; stroke-width: 1.2; }
      .features { fill: #edf4ee; stroke: #86a38b; stroke-width: 1.3; }
      .design { fill: #eef2f3; stroke: #8da4ad; stroke-width: 1.2; }
      .isolated { fill: #fff; stroke: #8b827d; stroke-width: 1.2; stroke-dasharray: 7 5; }
      .heading { fill: #1c1917; font: 600 27px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; }
      .subtitle, .caption, .note, .edge-label { fill: #57534e; font: 400 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .group-title { fill: #57534e; font: 650 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.1em; }
      .node-title { fill: #292524; font: 600 18px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .node-copy { fill: #57534e; font: 400 15px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #69635f; stroke-width: 1.55; marker-end: url(#frontend-arrow); }
      .arrow-head { fill: #69635f; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0c0a09; }
        .browser { fill: #1c1917; stroke: #292524; }
        .area { stroke: #57534e; }
        .node, .isolated { fill: #292524; stroke: #57534e; }
        .shell, .state { fill: #342e1c; stroke: #8f783f; }
        .features { fill: #19291d; stroke: #62806a; }
        .design { fill: #17262b; stroke: #607c86; }
        .heading, .node-title { fill: #f5f5f4; }
        .subtitle, .caption, .note, .edge-label { fill: #a8a29e; }
        .group-title, .node-copy { fill: #d6d3d1; }
        .edge { stroke: #a8a29e; }
        .arrow-head { fill: #a8a29e; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="820"/>
  <text class="heading" x="750" y="42" text-anchor="middle">DlightRAG — Web Frontend Ownership</text>
  <text class="subtitle" x="750" y="72" text-anchor="middle">Main-document Feature hosts, browser modules, isolated iframe content, and the server boundary</text>

  <rect class="browser" x="40" y="100" width="1090" height="675" rx="18"/>
  <text class="group-title" x="70" y="130">BROWSER PROCESS</text>
  <text class="caption" x="585" y="160" text-anchor="middle">STARTUP / BUILD CONTEXT · Vite supplies the document entry, pre-paint theme, locale, and built assets</text>

  <rect class="area" x="70" y="180" width="1030" height="305" rx="14"/>
  <text class="group-title" x="95" y="208">MAIN DOCUMENT · LIGHT DOM</text>

  <rect class="shell" x="100" y="235" width="330" height="145" rx="12"/>
  <text class="node-title" x="265" y="270" text-anchor="middle">dl-app Shell</text>
  <text class="node-copy" x="265" y="300" text-anchor="middle">constructs browser handles + routes</text>
  <text class="node-copy" x="265" y="328" text-anchor="middle">composes layout</text>
  <text class="node-copy" x="265" y="356" text-anchor="middle">mediates source handoff</text>

  <rect class="features" x="480" y="220" width="590" height="235" rx="14"/>
  <text class="node-title" x="775" y="253" text-anchor="middle">Collective light-DOM Lit Feature owners</text>
  <text class="node-copy" x="775" y="283" text-anchor="middle">Conversation · Chat · Inspector</text>
  <text class="node-copy" x="775" y="309" text-anchor="middle">Artifact Canvas · shared UI</text>
  <text class="node-copy" x="775" y="341" text-anchor="middle">typed properties in · typed events out</text>
  <text class="node-copy" x="775" y="373" text-anchor="middle">Features own interaction and async lifecycle</text>
  <text class="node-copy" x="775" y="405" text-anchor="middle">Chat privately owns RunController</text>
  <text class="node-copy" x="775" y="431" text-anchor="middle">and run following / replay</text>

  <rect class="design" x="70" y="515" width="300" height="105" rx="12"/>
  <text class="group-title" x="90" y="541">DESIGN SYSTEM</text>
  <text class="node-title" x="220" y="568" text-anchor="middle">Open-Shadow primitives</text>
  <text class="node-copy" x="220" y="592" text-anchor="middle">tokens · icons · foundations</text>
  <text class="node-copy" x="220" y="613" text-anchor="middle">no product state</text>

  <rect class="isolated" x="70" y="635" width="300" height="115" rx="12"/>
  <text class="group-title" x="90" y="661">ISOLATED CHILD DOCUMENT</text>
  <text class="node-title" x="220" y="688" text-anchor="middle">Artifact iframe</text>
  <text class="node-copy" x="220" y="714" text-anchor="middle">opaque srcdoc · explicit consent</text>
  <text class="node-copy" x="220" y="738" text-anchor="middle">destroyed on close</text>

  <rect class="area" x="400" y="515" width="700" height="230" rx="14"/>
  <text class="group-title" x="425" y="543">BROWSER MODULES · STATE AND API BOUNDARY</text>

  <rect class="state" x="425" y="560" width="310" height="165" rx="12"/>
  <text class="node-title" x="580" y="592" text-anchor="middle">Focused shared state</text>
  <text class="node-copy" x="580" y="621" text-anchor="middle">History routing · AppHandles stores</text>
  <text class="node-copy" x="580" y="649" text-anchor="middle">conversations · workspaces · ingest</text>
  <text class="node-copy" x="580" y="677" text-anchor="middle">attachments</text>
  <text class="node-copy" x="580" y="705" text-anchor="middle">answer-event cursors</text>

  <rect class="node" x="765" y="560" width="310" height="165" rx="12"/>
  <text class="node-title" x="920" y="592" text-anchor="middle">Browser API boundary</text>
  <text class="node-copy" x="920" y="621" text-anchor="middle">wire validation</text>
  <text class="node-copy" x="920" y="649" text-anchor="middle">same-origin API clients</text>
  <text class="node-copy" x="920" y="677" text-anchor="middle">/web/api/* commands + queries</text>
  <text class="node-copy" x="920" y="705" text-anchor="middle">server-sent events</text>

  <rect class="node" x="1180" y="545" width="280" height="180" rx="14"/>
  <text class="group-title" x="1205" y="574">SERVER PROCESS</text>
  <text class="node-title" x="1320" y="611" text-anchor="middle">FastAPI Web Adapter</text>
  <text class="node-copy" x="1320" y="642" text-anchor="middle">page + hashed assets</text>
  <text class="node-copy" x="1320" y="670" text-anchor="middle">/web/api/* · SSE</text>
  <text class="node-copy" x="1320" y="698" text-anchor="middle">authentication + CSRF boundary</text>

  <path class="edge" d="M 430 307.5 H 480"/>
  <path class="edge" d="M 600 455 V 505 H 220 V 515"/>
  <path class="edge" d="M 700 455 V 490 H 390 V 642.5 H 425"/>
  <path class="edge" d="M 1070 350 H 1115 V 642.5 H 1075"/>
  <path class="edge" d="M 480 410 H 385 V 692.5 H 370"/>
  <text class="edge-label" x="430" y="397" text-anchor="middle">Canvas loads</text>
  <path class="edge" d="M 1075 642.5 H 1180"/>
  <text class="edge-label" x="1127" y="629" text-anchor="middle">HTTP · SSE</text>

  <text class="note" x="750" y="805" text-anchor="middle">Solid arrows mean browser-time composition or invocation; they do not describe source-directory hierarchy.</text>
</svg>
