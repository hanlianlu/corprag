<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">DlightRAG runtime ownership</title>
  <desc id="description">Inside one DlightRAG process, inbound HTTP and MCP adapters call the transport-neutral Application Access policy before protected calls and invoke Application services separately; public status calls reach the Application facade directly. The trusted embedded Python Application interface also calls the facade directly. Application owns lifecycle and service accessors. Web Conversations accepts runs through Answer Service. Answer and top-level Retrieval pin prepared input and schedule durable Query-lane work through Engine Runtime. Corpus Administration schedules ingest, replace, delete, retry, and reset through the same Runtime's Corpus Mutation lane. Runtime dispatches Query and Corpus Mutation executors; Answer-internal retrieval uses the raw Retrieval Stage directly without a nested Run. Engine Answer projects optimistic provider streams, while Agent owns durable Assistant Turns and atomic ToolResult plus Host-update settlements. Parent Research Artifact attachments become fenced terminal publications. Retrieval and Corpus Administration use Engine RAG. Memory is an Application capability over the independent Memory package. Model Catalogue publication invalidates Answer capability profiles. Engine Answer, Agent, and RAG call provider-neutral AI, and RAG reaches LightRAG.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #fafaf9; }
      .boundary, .service-group { fill: #f5f5f4; stroke: #d6d3d1; stroke-width: 1; }
      .heading { fill: #1c1917; font: 600 25px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; }
      .subtitle, .note { fill: #57534e; font: 400 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .boundary-title { fill: #57534e; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em; }
      .node-title { fill: #292524; font: 600 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .small-title { fill: #292524; font: 600 14.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .node-copy { fill: #57534e; font: 400 13.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge-label { fill: #57534e; font: 500 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .interface, .service, .module { fill: #fff; stroke: #d6d3d1; stroke-width: 1; }
      .facade, .access, .policy { fill: #f7de9d; fill-opacity: 0.24; stroke: #d2b661; stroke-width: 1; }
      .foundation, .external { fill: #f5f5f4; stroke: #d2b661; stroke-width: 1; }
      .edge { fill: none; stroke: #78716c; stroke-width: 1.35; marker-end: url(#arrow); }
      .arrow-head { fill: #78716c; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0c0a09; }
        .boundary, .service-group { fill: #1c1917; stroke: #292524; }
        .heading, .node-title, .small-title { fill: #f5f5f4; }
        .subtitle, .note, .edge-label { fill: #a8a29e; }
        .boundary-title, .node-copy { fill: #d6d3d1; }
        .interface, .service, .module { fill: #292524; stroke: #44403c; }
        .facade, .access, .policy { fill: #574a24; fill-opacity: 0.55; stroke: #7e6c37; }
        .foundation, .external { fill: #292524; stroke: #7e6c37; }
        .edge { stroke: #78716c; }
        .arrow-head { fill: #78716c; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1200"/>
  <text class="heading" x="800" y="42" text-anchor="middle">DlightRAG — Runtime Ownership</text>
  <text class="subtitle" x="800" y="70" text-anchor="middle">In-process owners and primary runtime dependencies; import contracts are machine-enforced separately</text>

  <rect class="boundary" x="40" y="100" width="1520" height="1060" rx="18"/>
  <text class="boundary-title" x="75" y="134">DLIGHTRAG APPLICATION PROCESS</text>

  <rect class="interface" x="90" y="175" width="580" height="95" rx="12"/>
  <text class="node-title" x="380" y="212" text-anchor="middle">Inbound adapters</text>
  <text class="node-copy" x="380" y="242" text-anchor="middle">adapters.http · adapters.mcp</text>

  <rect class="interface" x="930" y="175" width="580" height="95" rx="12"/>
  <text class="node-title" x="1220" y="212" text-anchor="middle">Embedded interface</text>
  <text class="node-copy" x="1220" y="242" text-anchor="middle">trusted Python Application interface</text>

  <rect class="access" x="90" y="325" width="400" height="105" rx="12"/>
  <text class="node-title" x="290" y="363" text-anchor="middle">application.access</text>
  <text class="node-copy" x="290" y="393" text-anchor="middle">authentication · principal and owner scope</text>
  <text class="node-copy" x="290" y="416" text-anchor="middle">Workspace + Action policy</text>

  <rect class="facade" x="650" y="325" width="860" height="105" rx="12"/>
  <text class="node-title" x="1080" y="363" text-anchor="middle">Application facade and lifecycle</text>
  <text class="node-copy" x="1080" y="393" text-anchor="middle">config · startup / shutdown · health · service accessors</text>
  <text class="node-copy" x="1080" y="416" text-anchor="middle">public create_application · private composition</text>

  <rect class="service-group" x="80" y="485" width="1440" height="270" rx="16"/>
  <text class="boundary-title" x="110" y="517">APPLICATION SERVICE OWNERS</text>

  <rect class="service" x="100" y="540" width="220" height="130" rx="10"/>
  <text class="small-title" x="210" y="577" text-anchor="middle">Answer Service</text>
  <text class="node-copy" x="210" y="607" text-anchor="middle">accept · steer · follow-up</text>
  <text class="node-copy" x="210" y="630" text-anchor="middle">pin prepared input</text>

  <rect class="service" x="340" y="540" width="220" height="130" rx="10"/>
  <text class="small-title" x="450" y="577" text-anchor="middle">Web Conversations</text>
  <text class="node-copy" x="450" y="607" text-anchor="middle">owner history + routes</text>
  <text class="node-copy" x="450" y="630" text-anchor="middle">atomic turn linking</text>

  <rect class="service" x="580" y="540" width="270" height="130" rx="10"/>
  <text class="small-title" x="715" y="577" text-anchor="middle">Retrieval + Corpus Admin</text>
  <text class="node-copy" x="715" y="607" text-anchor="middle">durable retrieve · ingest · metadata</text>
  <text class="node-copy" x="715" y="630" text-anchor="middle">pin input · workspace lifecycle</text>

  <rect class="service" x="870" y="540" width="200" height="130" rx="10"/>
  <text class="small-title" x="970" y="577" text-anchor="middle">Memory Service</text>
  <text class="node-copy" x="970" y="607" text-anchor="middle">product gate</text>
  <text class="node-copy" x="970" y="630" text-anchor="middle">owner operations</text>

  <rect class="policy" x="1090" y="540" width="190" height="130" rx="10"/>
  <text class="small-title" x="1185" y="577" text-anchor="middle">Model Catalogue</text>
  <text class="node-copy" x="1185" y="607" text-anchor="middle">validate · publish</text>
  <text class="node-copy" x="1185" y="630" text-anchor="middle">reload overlay</text>

  <rect class="policy" x="1300" y="540" width="200" height="130" rx="10"/>
  <text class="small-title" x="1400" y="570" text-anchor="middle">Answer Capability</text>
  <text class="small-title" x="1400" y="590" text-anchor="middle">Coordinator</text>
  <text class="node-copy" x="1400" y="618" text-anchor="middle">profiles · image probes</text>
  <text class="node-copy" x="1400" y="641" text-anchor="middle">mode admission</text>

  <rect class="module" x="110" y="820" width="260" height="115" rx="12"/>
  <text class="node-title" x="240" y="860" text-anchor="middle">engine.runtime</text>
  <text class="node-copy" x="240" y="890" text-anchor="middle">Query + Corpus Mutation dispatch · leases</text>
  <text class="node-copy" x="240" y="913" text-anchor="middle">capacity · fencing · durable events</text>

  <rect class="module" x="430" y="820" width="280" height="115" rx="12"/>
  <text class="node-title" x="570" y="860" text-anchor="middle">engine.answer</text>
  <text class="node-copy" x="570" y="890" text-anchor="middle">AnswerExecutor · Fast / Research</text>
  <text class="node-copy" x="570" y="913" text-anchor="middle">stream · citations · publication</text>

  <rect class="module" x="770" y="820" width="280" height="115" rx="12"/>
  <text class="node-title" x="910" y="860" text-anchor="middle">engine.rag</text>
  <text class="node-copy" x="910" y="890" text-anchor="middle">WorkspacePool · WorkspaceRag</text>
  <text class="node-copy" x="910" y="913" text-anchor="middle">LightRAG integration</text>

  <rect class="external" x="1110" y="820" width="280" height="115" rx="12"/>
  <text class="node-title" x="1250" y="860" text-anchor="middle">dlightrag-memory</text>
  <text class="node-copy" x="1250" y="890" text-anchor="middle">independent Memory package</text>
  <text class="node-copy" x="1250" y="913" text-anchor="middle">Application owns the product gate</text>

  <rect class="foundation" x="330" y="1020" width="250" height="90" rx="12"/>
  <text class="node-title" x="455" y="1052" text-anchor="middle">engine.agent</text>
  <text class="node-copy" x="455" y="1077" text-anchor="middle">AgentSessionRuntime · durable Session</text>
  <text class="node-copy" x="455" y="1098" text-anchor="middle">turns · effect/Host settlement</text>

  <rect class="foundation" x="675" y="1020" width="260" height="90" rx="12"/>
  <text class="node-title" x="805" y="1056" text-anchor="middle">engine.ai</text>
  <text class="node-copy" x="805" y="1086" text-anchor="middle">Models · native provider streams</text>

  <rect class="external" x="1030" y="1020" width="250" height="90" rx="12"/>
  <text class="node-title" x="1155" y="1056" text-anchor="middle">LightRAG</text>
  <text class="node-copy" x="1155" y="1086" text-anchor="middle">external RAG package</text>

