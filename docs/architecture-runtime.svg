<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-labelledby="runtime-title runtime-description">
  <title id="runtime-title">DlightRAG runtime ownership</title>
  <desc id="runtime-description">One DlightRAG process has three visible code zones: Adapters, Application, and Engine. Inbound HTTP and MCP Adapters invoke Application use cases; trusted embedded callers enter the Application facade directly. Application invokes contracts owned by Engine. Runtime, Answer, RAG, Agent, and AI are sibling owners inside one prominent Engine zone. Outbound PostgreSQL and observability Adapters implement narrow owner ports. Solid arrows mean runtime invocation through an owner contract and do not mean a concrete import. Dashed arrows mean the private composition root constructs and injects collaborators; composition is not part of the request path.</desc>
  <defs>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #fafaf9; }
      .process { fill: #fff; stroke: #d6d3d1; stroke-width: 1.2; }
      .adapters-zone { fill: #eef2f3; stroke: #8da4ad; stroke-width: 1.3; }
      .application-zone { fill: #f7f2e5; stroke: #c6a85d; stroke-width: 1.3; }
      .engine-zone { fill: #edf4ee; stroke: #86a38b; stroke-width: 1.5; }
      .composition { fill: #f5f5f4; stroke: #a8a29e; stroke-width: 1.2; stroke-dasharray: 7 5; }
      .node { fill: #fff; stroke: #d6d3d1; stroke-width: 1.1; }
      .heading { fill: #1c1917; font: 600 28px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; }
      .subtitle, .note, .legend, .edge-label { fill: #57534e; font: 400 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .zone-title { fill: #44403c; font: 650 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.1em; }
      .node-title { fill: #292524; font: 600 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .zone-name { fill: #292524; font: 650 23px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.02em; }
      .node-copy { fill: #57534e; font: 400 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .edge { fill: none; stroke: #69635f; stroke-width: 1.55; marker-end: url(#runtime-arrow); }
      .wire { fill: none; stroke: #8b827d; stroke-width: 1.45; stroke-dasharray: 7 5; marker-end: url(#runtime-arrow); }
      .arrow-head { fill: #69635f; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0c0a09; }
        .process { fill: #0c0a09; stroke: #292524; }
        .adapters-zone { fill: #17262b; stroke: #607c86; }
        .application-zone { fill: #342e1c; stroke: #8f783f; }
        .engine-zone { fill: #19291d; stroke: #62806a; }
        .composition { fill: #1c1917; stroke: #57534e; }
        .node { fill: #292524; stroke: #44403c; }
        .heading, .node-title, .zone-name { fill: #f5f5f4; }
        .subtitle, .note, .legend, .edge-label { fill: #a8a29e; }
        .zone-title, .node-copy { fill: #d6d3d1; }
        .edge { stroke: #a8a29e; }
        .wire { stroke: #a8a29e; }
        .arrow-head { fill: #a8a29e; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1020"/>
  <text class="heading" x="900" y="42" text-anchor="middle">DlightRAG — Runtime Ownership</text>
  <text class="subtitle" x="900" y="72" text-anchor="middle">Code zones and primary runtime dependencies; detailed Answer, Retrieval, and Mutation paths remain in prose</text>

  <rect class="process" x="40" y="92" width="1720" height="823" rx="18"/>
  <text class="zone-title" x="70" y="121">ONE DLIGHTRAG APPLICATION PROCESS</text>

  <rect class="composition" x="190" y="140" width="1420" height="72" rx="12"/>
  <text class="node-title" x="900" y="169" text-anchor="middle">Private composition root</text>
  <text class="node-copy" x="900" y="196" text-anchor="middle">constructs Application; injects concrete Adapters, owner ports, and operation executors; never joins the request path</text>

  <rect class="adapters-zone" x="70" y="270" width="1660" height="145" rx="15"/>
  <text class="zone-title" x="95" y="296">ADAPTERS</text>

  <rect class="node" x="110" y="305" width="600" height="95" rx="11"/>
  <text class="node-title" x="410" y="334" text-anchor="middle">Inbound Adapters</text>
  <text class="node-copy" x="410" y="362" text-anchor="middle">HTTP · MCP invoke Application use cases</text>
  <text class="node-copy" x="410" y="386" text-anchor="middle">and consume only transport-neutral contracts</text>

  <rect class="node" x="1090" y="305" width="600" height="95" rx="11"/>
  <text class="node-title" x="1390" y="334" text-anchor="middle">Outbound Adapters</text>
  <text class="node-copy" x="1390" y="362" text-anchor="middle">PostgreSQL · observability implement narrow ports</text>
  <text class="node-copy" x="1390" y="386" text-anchor="middle">owned by Application or Engine</text>

  <rect class="application-zone" x="70" y="455" width="1660" height="155" rx="15"/>
  <text class="zone-title" x="95" y="481">APPLICATION</text>
  <text class="zone-name" x="900" y="515" text-anchor="middle">Public facade and product use cases</text>
  <text class="node-copy" x="900" y="545" text-anchor="middle">Access · configuration · lifecycle · health · service projections</text>
  <text class="node-copy" x="900" y="572" text-anchor="middle">Answer, Retrieval, and Corpus Mutation acceptance · Memory capability over the independent dlightrag-memory package</text>
  <text class="note" x="1650" y="598" text-anchor="end">trusted embedded callers enter here</text>

  <rect class="engine-zone" x="70" y="655" width="1660" height="230" rx="15"/>
  <text class="zone-title" x="95" y="682">ENGINE · FIVE SIBLING OWNERS IN ONE CODE ZONE — CARD POSITION DOES NOT DENOTE A TIER</text>

  <rect class="node" x="95" y="710" width="300" height="135" rx="11"/>
  <text class="node-title" x="245" y="742" text-anchor="middle">Runtime</text>
  <text class="node-copy" x="245" y="770" text-anchor="middle">durable Runs · lanes · fencing</text>
  <text class="node-copy" x="245" y="795" text-anchor="middle">may use Agent contracts</text>
  <text class="node-copy" x="245" y="820" text-anchor="middle">imports neither Answer nor RAG</text>

  <rect class="node" x="422" y="710" width="300" height="135" rx="11"/>
  <text class="node-title" x="572" y="742" text-anchor="middle">Answer</text>
  <text class="node-copy" x="572" y="770" text-anchor="middle">Fast + Research execution</text>
  <text class="node-copy" x="572" y="795" text-anchor="middle">citations · streams · artifacts</text>
  <text class="node-copy" x="572" y="820" text-anchor="middle">uses Runtime · RAG · Agent · AI</text>

  <rect class="node" x="749" y="710" width="300" height="135" rx="11"/>
  <text class="node-title" x="899" y="742" text-anchor="middle">RAG</text>
  <text class="node-copy" x="899" y="770" text-anchor="middle">retrieval + corpus semantics</text>
  <text class="node-copy" x="899" y="795" text-anchor="middle">owns the LightRAG integration</text>
  <text class="node-copy" x="899" y="820" text-anchor="middle">uses AI</text>

  <rect class="node" x="1076" y="710" width="300" height="135" rx="11"/>
  <text class="node-title" x="1226" y="742" text-anchor="middle">Agent</text>
  <text class="node-copy" x="1226" y="770" text-anchor="middle">product-neutral Sessions</text>
  <text class="node-copy" x="1226" y="795" text-anchor="middle">turn + effect settlement</text>
  <text class="node-copy" x="1226" y="820" text-anchor="middle">uses AI</text>

  <rect class="node" x="1403" y="710" width="300" height="135" rx="11"/>
  <text class="node-title" x="1553" y="742" text-anchor="middle">AI</text>
  <text class="node-copy" x="1553" y="770" text-anchor="middle">provider-neutral model runtime</text>
  <text class="node-copy" x="1553" y="795" text-anchor="middle">native provider streams</text>
  <text class="node-copy" x="1553" y="820" text-anchor="middle">Engine leaf owner</text>

  <path class="wire" d="M 410 212 V 305"/>
  <path class="wire" d="M 900 212 V 455"/>
  <path class="wire" d="M 1390 212 V 305"/>
  <path class="wire" d="M 190 176 H 55 V 775 H 70"/>

  <path class="edge" d="M 410 400 V 430 H 650 V 455"/>
  <text class="edge-label" x="530" y="423" text-anchor="middle">calls use cases</text>
  <path class="edge" d="M 900 610 V 655"/>
  <text class="edge-label" x="915" y="638">invokes Engine contracts</text>

  <path class="edge" d="M 1530 455 V 435 H 1390 V 400"/>
  <text class="edge-label" x="1455" y="416" text-anchor="middle">Application-owned port call</text>
  <path class="edge" d="M 1730 775 H 1747 V 430 H 1580 V 400"/>
  <text class="edge-label" x="1728" y="640" text-anchor="end">Engine-owned port call</text>

  <path class="edge" d="M 250 943 H 305"/>
  <text class="legend" x="318" y="949">runtime invocation through an owner contract — not a concrete import</text>
  <path class="wire" d="M 1025 943 H 1080"/>
  <text class="legend" x="1093" y="949">composition injection / wiring</text>
  <text class="note" x="900" y="981" text-anchor="middle">The private root supplies implementations, then leaves the runtime path. Application and Engine never import concrete Adapters.</text>
  <text class="note" x="900" y="1006" text-anchor="middle">Solid edges summarize primary invocation only; operation-specific scheduling, retrieval, mutation, and Answer flows are documented below.</text>
</svg>
