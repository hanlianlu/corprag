  <text class="edge-label" x="1235" y="305">trusted call</text>
  <path class="edge" d="M 1080 430 V 485"/>
  <text class="edge-label" x="1095" y="466">exposes</text>

  <path class="edge" d="M 450 540 V 525 H 210 V 540"/>
  <path class="edge" d="M 1185 540 V 520 H 1400 V 540"/>
  <text class="edge-label" x="1292.5" y="512" text-anchor="middle">publish invalidates profiles</text>
  <path class="edge" d="M 210 670 V 715 H 1400 V 670"/>
  <text class="edge-label" x="805" y="707" text-anchor="middle">resolve profiles · probe</text>

  <path class="edge" d="M 210 670 V 780 H 240 V 820"/>
  <text class="edge-label" x="255" y="798">accept / schedule</text>
  <path class="edge" d="M 650 670 V 745 H 300 V 820"/>
  <text class="edge-label" x="475" y="738" text-anchor="middle">accept Retrieval / Mutation</text>
  <path class="edge" d="M 715 670 V 780 H 910 V 820"/>
  <text class="edge-label" x="815" y="773" text-anchor="middle">metadata / workspace lifecycle</text>
  <path class="edge" d="M 970 670 V 780 H 1250 V 820"/>
  <text class="edge-label" x="1110" y="773" text-anchor="middle">owner operations</text>

  <path class="edge" d="M 370 877.5 H 430"/>
  <text class="edge-label" x="400" y="863" text-anchor="middle">dispatch Answer</text>
  <path class="edge" d="M 370 905 H 400 V 965 H 910 V 935"/>
  <text class="edge-label" x="650" y="957" text-anchor="middle">dispatch Retrieval / Mutation</text>
  <path class="edge" d="M 710 877.5 H 770"/>
  <text class="edge-label" x="740" y="863" text-anchor="middle">retrieve</text>

  <path class="edge" d="M 500 935 V 980 H 455 V 1020"/>
  <text class="edge-label" x="470" y="999">hosts Session</text>
  <path class="edge" d="M 570 935 V 990 H 805 V 1020"/>
  <text class="edge-label" x="685" y="982" text-anchor="middle">provider stream</text>
  <path class="edge" d="M 910 935 V 970 H 805 V 1020"/>
  <text class="edge-label" x="870" y="962">model calls</text>
  <path class="edge" d="M 960 935 V 990 H 1155 V 1020"/>
  <text class="edge-label" x="1060" y="982" text-anchor="middle">uses</text>
  <path class="edge" d="M 580 1065 H 675"/>
  <text class="edge-label" x="627.5" y="1051" text-anchor="middle">turn contract</text>

  <text class="note" x="800" y="1140" text-anchor="middle">Access precedes protected remote calls; public status calls reach the facade directly; the embedded interface has no transport ACL.</text>
</svg>
