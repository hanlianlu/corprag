<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">DlightRAG deployment and storage topology</title>
  <desc id="deployment-description">Writer and optional Reader role archetypes each run DlightRAG with an embedded LightRAG runtime. Both roles use one PostgreSQL 18 primary and may call AI providers; only Writer calls the configured MinerU or Docling parser and claims corpus mutation work. Serving roles mount the same corpus root. Processes executing local Research also mount a separate shared Agent Workspace root and may call optional Research integrations. Plain lines are database or mount connections, directed arrows are outbound runtime calls, and dashed connections are conditional.</desc>
  <defs>
    <marker id="deployment-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" class="arrow-head"/>
    </marker>
    <style>
      :root { color-scheme: light dark; }
      .canvas { fill: #fafaf9; }
      .group { fill: #f5f5f4; stroke: #d6d3d1; stroke-width: 1.2; }
      .process { fill: #fff; stroke: #d6d3d1; stroke-width: 1.2; }
      .store { fill: #f7f2e5; stroke: #c6a85d; stroke-width: 1.2; }
      .external { fill: #eef2f3; stroke: #8da4ad; stroke-width: 1.2; }
      .heading { fill: #1c1917; font: 600 28px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; }
      .subtitle, .note, .legend, .edge-label { fill: #57534e; font: 400 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .group-title { fill: #57534e; font: 650 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.1em; }
      .node-title { fill: #292524; font: 600 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .node-copy { fill: #57534e; font: 400 17px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .connection { fill: none; stroke: #78716c; stroke-width: 1.5; }
      .conditional-connection { fill: none; stroke: #78716c; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .call { fill: none; stroke: #69635f; stroke-width: 1.55; marker-end: url(#deployment-arrow); }
      .optional-call { fill: none; stroke: #69635f; stroke-width: 1.55; stroke-dasharray: 7 5; marker-end: url(#deployment-arrow); }
      .bridge { fill: none; stroke: #fafaf9; stroke-width: 6; }
      .arrow-head { fill: #69635f; }
      @media (prefers-color-scheme: dark) {
        .canvas { fill: #0c0a09; }
        .group { fill: #1c1917; stroke: #292524; }
        .process { fill: #292524; stroke: #44403c; }
        .store { fill: #342e1c; stroke: #8f783f; }
        .external { fill: #17262b; stroke: #607c86; }
        .heading, .node-title { fill: #f5f5f4; }
        .subtitle, .note, .legend, .edge-label { fill: #a8a29e; }
        .group-title, .node-copy { fill: #d6d3d1; }
        .connection, .conditional-connection { stroke: #a8a29e; }
        .call, .optional-call { stroke: #a8a29e; }
        .bridge { stroke: #0c0a09; }
        .arrow-head { fill: #a8a29e; }
      }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="950"/>
  <text class="heading" x="800" y="42" text-anchor="middle">DlightRAG — Deployment and Storage</text>
  <text class="subtitle" x="800" y="70" text-anchor="middle">Process-role archetypes, external runtime connections, and the corpus and run-workspace storage roots</text>

  <rect class="group" x="40" y="120" width="920" height="335" rx="16"/>
  <text class="group-title" x="70" y="151">DLIGHTRAG SERVICE PROCESSES</text>

  <rect class="process" x="80" y="175" width="420" height="225" rx="12"/>
  <text class="node-title" x="290" y="210" text-anchor="middle">Writer role (1..n)</text>
  <text class="node-copy" x="290" y="240" text-anchor="middle">DlightRAG + embedded LightRAG</text>
  <text class="node-copy" x="290" y="270" text-anchor="middle">Query + Corpus Mutation workers</text>
  <text class="node-copy" x="290" y="300" text-anchor="middle">operational RW · corpus RW / DDL</text>
  <text class="node-copy" x="290" y="330" text-anchor="middle">normal LightRAG initialization</text>
  <text class="node-copy" x="290" y="360" text-anchor="middle">migration owner</text>

  <rect class="process" x="540" y="175" width="380" height="225" rx="12"/>
  <text class="node-title" x="730" y="207" text-anchor="middle">Optional Reader role (0..n)</text>
  <text class="node-copy" x="730" y="235" text-anchor="middle">DlightRAG + embedded LightRAG</text>
  <text class="node-copy" x="730" y="261" text-anchor="middle">Query workers · operational RW</text>
  <text class="node-copy" x="730" y="287" text-anchor="middle">may enqueue authorized Mutation Runs</text>
  <text class="node-copy" x="730" y="313" text-anchor="middle">never claims or executes mutation work</text>
  <text class="node-copy" x="730" y="339" text-anchor="middle">read-only LightRAG attach</text>
  <text class="node-copy" x="730" y="365" text-anchor="middle">schema validation only · no DDL</text>

  <rect class="group" x="1010" y="120" width="550" height="335" rx="16"/>
  <text class="group-title" x="1040" y="151">EXTERNAL RUNTIMES</text>

  <rect class="external" x="1040" y="165" width="490" height="75" rx="11"/>
  <text class="node-title" x="1285" y="194" text-anchor="middle">One parser endpoint</text>
  <text class="node-copy" x="1285" y="220" text-anchor="middle">MinerU or Docling · Writer ingestion only</text>

  <rect class="external" x="1040" y="260" width="490" height="75" rx="11"/>
  <text class="node-title" x="1285" y="289" text-anchor="middle">AI provider endpoints</text>
  <text class="node-copy" x="1285" y="315" text-anchor="middle">chat · VLM · embedding · rerank · both roles</text>

  <rect class="external" x="1040" y="355" width="490" height="75" rx="11"/>
  <text class="node-title" x="1285" y="384" text-anchor="middle">Optional Research integrations</text>
  <text class="node-copy" x="1285" y="410" text-anchor="middle">Exa/Tavily · outbound MCP · Research only</text>

  <path class="call" d="M 290 175 V 100 H 1285 V 165"/>
  <text class="edge-label" x="790" y="96" text-anchor="middle">Writer-only parser call</text>
  <path class="call" d="M 960 297.5 H 1040"/>
  <text class="edge-label" x="1000" y="284" text-anchor="middle">both roles</text>
  <path class="optional-call" d="M 960 392.5 H 1040"/>
  <text class="edge-label" x="1000" y="379" text-anchor="middle">Research</text>

  <rect class="group" x="40" y="545" width="1520" height="260" rx="16"/>
  <text class="group-title" x="70" y="576">SHARED STATE AND MOUNTS</text>

  <rect class="store" x="70" y="600" width="620" height="165" rx="12"/>
  <text class="node-title" x="380" y="633" text-anchor="middle">PostgreSQL 18 primary</text>
  <text class="node-copy" x="380" y="663" text-anchor="middle">DlightRAG operational + Memory: both roles RW</text>
  <text class="node-copy" x="380" y="690" text-anchor="middle">Corpus state: Writer RW / DDL · Reader RO / no DDL</text>
  <text class="node-copy" x="380" y="717" text-anchor="middle">graph · KV · doc status · BM25 · pgvector (default)</text>
  <text class="node-copy" x="380" y="744" text-anchor="middle">one primary endpoint; migrations run before Readers start</text>

  <rect class="store" x="730" y="600" width="380" height="165" rx="12"/>
  <text class="node-title" x="920" y="633" text-anchor="middle">Shared POSIX corpus root</text>
  <text class="node-copy" x="920" y="663" text-anchor="middle">deployment.working_dir</text>
  <text class="node-copy" x="920" y="690" text-anchor="middle">same absolute path on serving processes</text>
  <text class="node-copy" x="920" y="717" text-anchor="middle">Writer mutates · serving roles read</text>
  <text class="node-copy" x="920" y="744" text-anchor="middle">corpus images + downloads</text>

  <rect class="store" x="1150" y="600" width="380" height="165" rx="12"/>
  <text class="node-title" x="1340" y="633" text-anchor="middle">Agent Workspace root</text>
  <text class="node-copy" x="1340" y="663" text-anchor="middle">answer.agent.workspace_root</text>
  <text class="node-copy" x="1340" y="690" text-anchor="middle">separate and non-overlapping</text>
  <text class="node-copy" x="1340" y="717" text-anchor="middle">shared RWX for local Research</text>
  <text class="node-copy" x="1340" y="744" text-anchor="middle">mounted only where Research executes</text>

  <path class="connection" d="M 150 400 V 600"/>
  <text class="edge-label" x="164" y="520">Writer SQL</text>
  <path class="connection" d="M 600 400 V 600"/>
  <text class="edge-label" x="614" y="520">Reader SQL</text>

  <path class="connection" d="M 450 400 V 500 H 800 V 600"/>
  <path class="bridge" d="M 450 400 V 500 H 800 V 600"/>
  <path class="connection" d="M 450 400 V 500 H 800 V 600"/>
  <text class="edge-label" x="665" y="492" text-anchor="middle">Writer mount</text>
  <path class="connection" d="M 820 400 V 480 H 990 V 600"/>
  <text class="edge-label" x="905" y="472" text-anchor="middle">Reader mount</text>

  <path class="conditional-connection" d="M 950 455 V 520 H 1340 V 600"/>
  <text class="edge-label" x="1160" y="512" text-anchor="middle">mount only where local Research executes</text>

  <path class="connection" d="M 65 842 H 120"/>
  <text class="legend" x="132" y="847">database or mount</text>
  <path class="call" d="M 310 842 H 365"/>
  <text class="legend" x="377" y="847">outbound runtime call</text>
  <path class="optional-call" d="M 590 842 H 645"/>
  <text class="legend" x="657" y="847">conditional / optional</text>

  <text class="note" x="800" y="880" text-anchor="middle">Bundled Compose runs its API and MCP services as Writer-role processes; these cards describe supported role archetypes, not instance counts.</text>
  <text class="note" x="800" y="906" text-anchor="middle">Milvus or Zilliz may replace only pgvector in writer-only deployments; Reader role is then unavailable.</text>
  <text class="note" x="800" y="932" text-anchor="middle">Only corpus and run-workspace roots are shown; Skills mounts remain deployment configuration.</text>
</svg>
