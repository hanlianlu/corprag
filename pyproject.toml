[project]
name = "dlightrag"
version = "2.0.5"
description = "Multimodal RAG with knowledge graph and contextual intelligence"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
maintainers = [{ name = "HanlianLyu" }, { name = "hllyu" }]
dependencies = [
    # Standalone workspace package
    "dlightrag-memory==2.0.5",
    # Built-in model providers (batteries included)
    "openai>=2.54.0",
    "anthropic>=1.4.0",
    "google-genai>=2.22.0",
    "json-repair>=0.63.4",
    # Built-in RAG and source capabilities
    "lightrag-hku>=1.5.7",
    "aiofiles>=24.1.0",
    "aiobotocore>=3.9.0",
    "azure-storage-blob>=12.30.1",
    "botocore>=1.43.3",
    "lingua-language-detector>=2.2.0",
    # PostgreSQL
    "asyncpg>=0.31.0",
    "numpy>=2.5.0",
    "pgvector>=0.5.0",
    # Config
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    # Utils
    "httpx>=0.28.1",
    "pathspec>=1.0.4",
    "pillow>=12.3.0",
    # Request-local lexical retrieval for Web Composer documents.
    "bm25s>=0.3.11",
    # LightRAG paragraph_semantic chunker fallback
    "langchain-text-splitters",
    # MCP server
    "mcp>=2.1.1",
    # REST API server
    "PyJWT>=2.8.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.22",
    # Web frontend
    "markdown-it-py[plugins]>=3.0",
    "nh3>=0.3.7",
    "pygments>=2.17",
    # Observability
    "langfuse>=4.15.1",
    # Native docx parsing: lightrag's docx parser imports python-docx + defusedxml.
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    # Direct-text charset detection for answer resource reads.
    "charset-normalizer>=3.4.0",
    # Deterministic binary answer-resource readers (selected extras only).
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.7",
    "pypdfium2>=5.13.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
# LightRAG's Milvus module attempts a runtime install when this client is
# absent. DlightRAG preflights instead; deployments opt in deterministically.
milvus = ["pymilvus>=2.6.2"]

[dependency-groups]
eval = [
    "lightrag-hku[evaluation]>=1.5.7",
]
dev = [
    "bandit>=1.9.4",
    "import-linter>=2.15",
    "pre-commit>=4.6.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.8.0",
    "questionary>=2",
    "rich>=13",
    "ruamel.yaml>=0.18",
    "ruff>=0.16.6",
    "shellcheck-py>=0.10",
]

[project.urls]
Homepage = "https://github.com/hanlianlu/dlightrag"
Repository = "https://github.com/hanlianlu/dlightrag"
Issues = "https://github.com/hanlianlu/dlightrag/issues"

[project.scripts]
dlightrag-mcp = "dlightrag.adapters.mcp.cli:main"
dlightrag-api = "dlightrag.adapters.http.server:main"
dlightrag-rebuild-bm25 = "dlightrag.engine.rag.corpus.rebuild_bm25:main"
dlightrag-rebuild-vdb = "dlightrag.engine.rag.corpus.rebuild_vdb:main"

[build-system]
# Forward-only policy: CI verifies new backend releases; do not add an upper bound.
requires = ["uv_build>=0.11.21"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/memory"]

[tool.uv.sources]
dlightrag-memory = { workspace = true }

[tool.uv.build-backend]
# uv_build includes generated module data even when gitignored; reject local OS metadata.
source-exclude = ["**/.DS_Store"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: Playwright-driven end-to-end UI tests",
    "integration: requires running PostgreSQL",
    "e2e_pg18: opt-in PostgreSQL 18 + LightRAG smoke tests",
    "load_runtime: opt-in deterministic 10k-client RunRuntime load evidence",
]

[tool.importlinter]
root_packages = ["dlightrag", "dlightrag_memory"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "memory-package-independence"
name = "Memory package stays host-neutral"
type = "forbidden"
source_modules = ["dlightrag_memory"]
forbidden_modules = ["dlightrag", "lightrag", "fastapi"]

[[tool.importlinter.contracts]]
id = "ai-module-independence"
name = "AI remains provider-neutral and independent of product modules"
type = "forbidden"
source_modules = ["dlightrag.engine.ai"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.engine.agent", "dlightrag.engine.answer", "dlightrag.adapters.observability", "dlightrag.engine.rag", "dlightrag.engine.runtime", "dlightrag_memory", "lightrag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "agent-module-independence"
name = "Agent may depend on AI but not product or RAG modules"
type = "forbidden"
source_modules = ["dlightrag.engine.agent"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.engine.answer", "dlightrag.adapters.observability", "dlightrag.engine.rag", "dlightrag.engine.runtime", "dlightrag_memory", "lightrag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "rag-module-independence"
name = "RAG runtime remains storage-neutral and independent of product modules"
type = "forbidden"
source_modules = ["dlightrag.engine.rag"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters", "dlightrag.engine.agent", "dlightrag.engine.answer", "dlightrag.adapters.observability", "dlightrag.engine.runtime", "dlightrag_memory", "asyncpg", "fastapi", "mcp"]
ignore_imports = [
    "dlightrag.engine.rag.corpus.rebuild_bm25 -> dlightrag.adapters.postgres.core._pool",
    "dlightrag.engine.rag.corpus.rebuild_bm25 -> dlightrag.adapters.postgres.corpus.corpus",
    "dlightrag.engine.rag.corpus.rebuild_bm25 -> dlightrag.adapters.postgres.corpus.corpus_bm25",
    "dlightrag.engine.rag.corpus.rebuild_bm25 -> dlightrag.application.config",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.adapters.postgres.corpus.corpus",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.adapters.postgres.corpus.corpus_chunks",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.adapters.postgres.corpus.lightrag_contract",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.application.config",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.application.settings",
    "dlightrag.engine.rag.corpus.rebuild_vdb -> dlightrag.adapters.observability",
]

[[tool.importlinter.contracts]]
id = "no-transport-internals"
name = "Internal packages must not import transport layers"
type = "forbidden"
source_modules = ["dlightrag.engine.answer", "dlightrag.application", "dlightrag.adapters.observability"]
forbidden_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]

[[tool.importlinter.contracts]]
id = "transport-corpus-implementation-direction"
name = "Transports depend on Application Corpus Administration"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]
forbidden_modules = ["dlightrag.engine.rag.workspace.pool", "dlightrag.engine.rag.workspace.ports", "dlightrag.engine.rag.corpus.ingest_jobs", "dlightrag.engine.rag.corpus.metadata_index", "dlightrag.engine.rag.retrieval.ports", "dlightrag.engine.rag.corpus.ingestion", "dlightrag.engine.rag.corpus.downloads", "dlightrag.engine.rag.retrieval.federation", "dlightrag.engine.rag.lightrag", "dlightrag.engine.rag.retrieval.rerank", "dlightrag.engine.rag.corpus.reset", "dlightrag.engine.rag.workspace.settings", "dlightrag.engine.rag.corpus.visual_assets", "dlightrag.engine.rag.workspace.workspace_rag"]

[[tool.importlinter.contracts]]
id = "transports-not-engine-answer"
name = "Inbound transports do not import Answer execution"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]
forbidden_modules = ["dlightrag.engine.answer"]

[[tool.importlinter.contracts]]
id = "inbound-transports-not-engine"
name = "HTTP and MCP import Application, not Engine"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]
forbidden_modules = ["dlightrag.engine"]
ignore_imports = [
    "dlightrag.adapters.mcp.outbound -> dlightrag.engine.agent.tools",
]

[[tool.importlinter.contracts]]
id = "answer-independence"
name = "Answer execution has no access, adapter, or transport dependencies"
type = "forbidden"
source_modules = ["dlightrag.engine.answer"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.adapters.postgres", "dlightrag.adapters.http", "dlightrag.adapters.mcp", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "access-independence"
name = "Access owns identity and authorization only"
type = "forbidden"
source_modules = ["dlightrag.application.access"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.config", "dlightrag.application.corpus_admin", "dlightrag.application.memory", "dlightrag.application.retrieval", "dlightrag.application.settings", "dlightrag.application.web_conversations", "dlightrag.adapters", "dlightrag.engine.answer", "dlightrag.engine.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "http-client-independence"
name = "Internal HTTP client stays a REST helper"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["dlightrag.adapters.http.client"]
forbidden_modules = ["dlightrag.adapters.postgres", "dlightrag.adapters.http.rest", "dlightrag.adapters.http.server", "dlightrag.adapters.http.browser", "dlightrag.adapters.mcp", "dlightrag.engine.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "retrieval-service-independence"
name = "Application Retrieval owns inline retrieval"
type = "forbidden"
source_modules = ["dlightrag.application.retrieval"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "answer-service-independence"
name = "Application Answer Runs owns durable run acceptance"
type = "forbidden"
source_modules = ["dlightrag.application.answer_runs"]
forbidden_modules = ["dlightrag.application.access", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "postgres-adapter-owner-direction"
name = "PostgreSQL adapters never import API or MCP"
type = "forbidden"
source_modules = ["dlightrag.adapters.postgres"]
forbidden_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]

[[tool.importlinter.contracts]]
id = "postgres-answer-not-web"
name = "PostgreSQL answer adapters must not import postgres.web"
type = "forbidden"
source_modules = ["dlightrag.adapters.postgres.answer"]
forbidden_modules = ["dlightrag.adapters.postgres.web"]

[[tool.importlinter.contracts]]
id = "postgres-core-no-capability-adapters"
name = "PostgreSQL core imports no capability adapters"
type = "forbidden"
source_modules = ["dlightrag.adapters.postgres.core"]
forbidden_modules = [
    "dlightrag.adapters.postgres.corpus",
    "dlightrag.adapters.postgres.answer",
    "dlightrag.adapters.postgres.web",
]

[[tool.importlinter.contracts]]
id = "runtime-independence"
name = "Durable runtime remains storage and product-policy neutral"
type = "forbidden"
source_modules = ["dlightrag.engine.runtime"]
forbidden_modules = ["dlightrag.application", "dlightrag.adapters.postgres", "dlightrag.engine.answer", "dlightrag.adapters.http", "dlightrag.adapters.mcp", "dlightrag.engine.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "corpus-admin-independence"
name = "Corpus Administration remains composition and adapter neutral"
type = "forbidden"
source_modules = ["dlightrag.application.corpus_admin"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.config", "dlightrag.application.settings", "dlightrag.adapters", "dlightrag.engine.answer", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "application-no-adapters-or-inbound-transports"
name = "Application does not compose or import adapters and transports"
type = "forbidden"
source_modules = ["dlightrag.application"]
forbidden_modules = ["dlightrag._compose", "dlightrag.adapters"]

[[tool.importlinter.contracts]]
id = "application-health-independence"
name = "Application health remains composition and adapter neutral"
type = "forbidden"
source_modules = ["dlightrag.application.health"]
forbidden_modules = ["dlightrag.application.answer_runs", "dlightrag.application.corpus_admin", "dlightrag.application.retrieval", "dlightrag.adapters", "dlightrag.engine.rag", "asyncpg", "fastapi", "mcp"]

[[tool.importlinter.contracts]]
id = "status-route-health-only"
name = "Status routes consume Application health"
type = "forbidden"
source_modules = ["dlightrag.adapters.http.rest.routes.status"]
forbidden_modules = ["dlightrag.engine.answer", "dlightrag.adapters.postgres"]

[[tool.importlinter.contracts]]
id = "no-circular-foundation"
name = "Configuration does not import projections, Answer, PostgreSQL, or Observability"
type = "forbidden"
source_modules = ["dlightrag.application.config"]
forbidden_modules = ["dlightrag.application.settings", "dlightrag.application.answer_runs", "dlightrag.adapters.postgres", "dlightrag.adapters.observability", "dlightrag.engine.answer"]

[[tool.importlinter.contracts]]
id = "transport-postgres-adapter-direction"
name = "Transport owners do not import PostgreSQL implementations"
type = "forbidden"
source_modules = ["dlightrag.adapters.http", "dlightrag.adapters.mcp"]
forbidden_modules = ["dlightrag.adapters.postgres"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "foundation-layers"
name = "Application settings project Application configuration"
type = "layers"
layers = ["dlightrag.application.settings", "dlightrag.application.config", "dlightrag.adapters.observability"]

[[tool.importlinter.contracts]]
id = "resources-below-tools"
name = "The resource domain must not import the tool package"
type = "forbidden"
source_modules = ["dlightrag.engine.answer.resources"]
forbidden_modules = ["dlightrag.engine.answer.tools"]

[[tool.importlinter.contracts]]
id = "tools-below-agent"
name = "Tools are composed per run, never by importing the orchestrator"
type = "forbidden"
source_modules = ["dlightrag.engine.answer.tools"]
forbidden_modules = ["dlightrag.engine.answer.orchestration", "dlightrag.engine.answer.execution", "dlightrag.engine.answer.runs"]
