name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14.7"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make sync-dev
      - run: make lint
      - run: make lint-security
      - run: make format-check
      - run: make typecheck
      - run: make architecture-check
      - run: make shellcheck-all
      - run: make release-check
      - run: make frontend-install
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make frontend-typecheck
      - run: make frontend-lint
      - run: make frontend-test
      - run: make frontend-browser-test
      - run: make workspace-wheels
      - run: make frontend-audit
      - run: make test-unit

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14.7"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make sync-dev
      - run: make frontend-install
      - run: uv run playwright install --with-deps chromium
      - run: make frontend-build
      - name: Run mocked browser E2E tests
        id: browser-tests
        env:
          DLIGHTRAG_E2E_ARTIFACT_DIR: .test-results/browser-e2e
        run: >-
          uv run pytest tests/e2e
          -m e2e
          -v --tb=long
          --junitxml=.test-results/browser-e2e.xml
      - name: Reject empty or skipped browser E2E results
        if: ${{ always() && steps.browser-tests.outcome != 'skipped' }}
        run: >-
          uv run python -c
          'import pathlib, xml.etree.ElementTree as ET;
          root = ET.parse(pathlib.Path(".test-results/browser-e2e.xml")).getroot();
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite");
          tests = sum(int(suite.get("tests", "0")) for suite in suites);
          skipped = sum(int(suite.get("skipped", "0")) for suite in suites);
          assert tests > 0 and skipped == 0,
          f"Browser E2E: {tests} tests, {skipped} skipped"'
      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ github.run_attempt }}
          path: .test-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: ghcr.io/${{ github.repository_owner }}/dlightrag-postgres@sha256:15f4dcf1bb294adc8b8c368776d7040efc730a1c25d82f8f72bbb61b181e66df
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: dlightrag
      PGPASSWORD: dlightrag
      PGDATABASE: dlightrag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14.7"
      - name: Start clean PostgreSQL
        run: |
          docker run --detach --name dlightrag-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_DB=dlightrag \
            --env POSTGRES_USER=dlightrag \
            --env POSTGRES_PASSWORD=dlightrag \
            --health-cmd "pg_isready -U dlightrag -d dlightrag" \
            --health-interval 15s \
            --health-timeout 10s \
            --health-retries 10 \
            "$POSTGRES_IMAGE" \
            postgres -c shared_preload_libraries=pg_textsearch,pg_jieba
          for _ in {1..120}; do
            if ! status="$(
              docker inspect \
                --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' \
                dlightrag-ci-postgres 2>/dev/null
            )"; then
              echo "PostgreSQL container disappeared during startup" >&2
              break
            fi
            if [ "$status" = "running healthy" ]; then
              exit 0
            fi
            case "$status" in
              exited*|dead*|*unhealthy)
                break
                ;;
            esac
            sleep 1
          done
          docker logs dlightrag-ci-postgres || true
          exit 1
      - run: uv sync --group dev
      - name: Run deterministic durable PostgreSQL integration tests
        run: >-
          uv run pytest
          tests/integration/test_agent_session_pg.py
          tests/integration/test_answer_runs_pg.py
          tests/integration/test_answer_run_api_pg.py
          tests/integration/test_answer_run_coordinator_pg.py
          tests/integration/test_memory_pg.py
          tests/integration/test_run_cancellation_pg.py
          tests/integration/test_pg_storage.py
          tests/integration/test_retrieval_runs_pg.py
          tests/integration/test_corpus_mutation_runs_pg.py
          tests/integration/test_corpus_mutation_phase_faults_pg.py
          tests/integration/test_run_runtime_lane_independence_pg.py
          tests/integration/test_run_runtime_query_plans_pg.py
          -q --tb=short --junitxml=.test-results/postgres.xml
      - name: Reject skipped PostgreSQL integration tests
        run: >-
          uv run python -c
          'import pathlib, xml.etree.ElementTree as ET;
          suite = ET.parse(pathlib.Path(".test-results/postgres.xml")).getroot().find("testsuite");
          assert suite is not None;
          tests, skipped = int(suite.get("tests", "0")), int(suite.get("skipped", "0"));
          assert tests > 0 and skipped == 0, f"PostgreSQL integration: {tests} tests, {skipped} skipped"'
      - name: Remove PostgreSQL container
        if: always()
        run: docker rm --force dlightrag-ci-postgres 2>/dev/null || true
